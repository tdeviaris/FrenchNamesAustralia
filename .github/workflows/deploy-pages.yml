name: Deploy to GitHub Pages

# Le site est servi par Vercel, qui se deploie a chaque push. GitHub Pages
# n'est pas disponible pour ce depot prive : lance a chaque push, ce workflow
# echouait et envoyait un mail. Il ne part plus qu'a la main.
on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
